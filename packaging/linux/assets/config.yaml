runtime:
  mode: production
  allow_fallback: false

# vNext 链路切流（默认 vNext 主链路；说明见 docs/configuration.md）
vnext:
  # legacy | shadow | dual-read | canary | vnext
  mode: vnext
  canary_percent: 0
  policy_required: true
  authority_single_writer: true
  allow_policy_bypass: false
  allow_legacy_read_fallback: true
  rollback_window_minutes: 60
  observation_window_requests: 1
  # shadow | candidate-only | authority
  formation_mode: authority
  events_default: true

storage:
  db_path: data/memoryhub.db
  vector_index_path: data/vector_index
  evidence_path: data/evidence
  cache_max_size: 1000

retrieval:
  default_top_k: 5
  candidate_multiplier: 4
  max_query_chars: 512
  target_p95_ms: 350
  target_p99_ms: 500
  vector_weight: 0.6
  keyword_weight: 0.3
  metadata_weight: 0.1
  rerank_enabled: true
  cache_ttl_seconds: 300

llm:
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 仅通过 LLM_API_KEY / MEMORYHUB_LLM_API_KEY 环境变量注入，不要把密钥写入文件。
  api_key: ""
  model: qwen-flash
  temperature: 0.1
  max_tokens: 2048
  fact_extraction_timeout_seconds: 1.0

embedding:
  provider: kylin
  # 麒麟 Embedding SDK 契约固定 768 维（docs/reference/kylin-embedding-runtime-contract.md）
  dimension: 768
  model_name: ensemble-embd_gte-base_uint8-text
  # 留空时由动态加载器/ldconfig 自动定位 V11 的
  # libkysdk-coreai-embedding.so.1，并兼容旧名称与 multiarch 路径。
  so_path: ""
  query_timeout_ms: 250

vector_engine:
  provider: milvus
  app_id: "kylin-memoryhub"
  so_path: "/usr/lib/memoryhub/native/libkysdk-vector-engine-client-capi.so"
  # 空 host + local_socket=true 使用麒麟每用户 Unix Socket。
  host: ""
  port: 19530
  collection: memoryhub
  dimension: 768
  search_timeout_ms: 120
  local_socket: true
  # 留空时使用 kylin-ai-vector-engine 用户服务已加载的默认数据库；V11
  # 对运行中的服务再次 LoadDBFile 会返回 SERVER_FAILED。
  db_path: ""
  db_encrypt: false
  db_key_env: MEMORYHUB_VECTOR_ENGINE_DB_KEY

safety:
  rule_set_id: kylin-memoryhub.safety
  rule_set_version: "1.0"
  policy:
    policy_id: default
    version: "1.0"
    rule_overrides: []
    level_overrides: []
    exceptions: []
    fallback_action: review
    on_scan_error: review
    on_unmaskable: review
    auto_sanitize: true
    fail_closed: true
  auto_mask: true
  reject_on_detect: false
  audit:
    enabled: true
    directory: data/safety-audit
    hmac_key_env: MEMORYHUB_AUDIT_HMAC_KEY
    key_id: device-local-v1
    rotate_max_bytes: 16777216
    retention_days: 180
    max_record_bytes: 65536
    lock_timeout_seconds: 5.0
    strict_permissions: true
    fsync: true
    fail_closed: true
  quarantine:
    enabled: true
    directory: data/review-quarantine
    encryption_key_env: MEMORYHUB_QUARANTINE_KEY
    key_id: device-local-v1
    retention_days: 30
    max_record_bytes: 4194304
    strict_permissions: true
    fsync: true
    fail_closed: true
  user_rules:
    # The standalone desktop service has no external request identity resolver.
    # Keep the built-in safety gate enabled while disabling only per-user rules.
    enabled: false
    encryption_key_env: MEMORYHUB_USER_RULE_KEY
    key_id: device-local-v1
    max_rules_per_user: 100
    max_matcher_chars: 2048
    allow_advanced_regex: false
    detector_cache_size: 256

# 服务监听地址/端口由启动器固定为 127.0.0.1:8099（uvicorn 命令行参数）
debug: false
