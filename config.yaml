# 运行时模式（FACT 已并入 knowledge 单一来源，legacy Fact 管线已删除，REFACTOR_PLAN_V2 §4.8）
runtime:
  mode: development
  allow_fallback: true

storage:
  db_path: data/memoryhub.db
  vector_index_path: data/vector_index
  evidence_path: data/evidence
  cache_max_size: 1000
retrieval:
  default_top_k: 5
  vector_weight: 0.6
  keyword_weight: 0.3
  metadata_weight: 0.1
  rerank_enabled: true
  cache_ttl_seconds: 300
llm:
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 仅通过 LLM_API_KEY / MEMORYHUB_LLM_API_KEY 注入，不要把密钥写入仓库。
  api_key: ""
  model: qwen-flash
  temperature: 0.1
  max_tokens: 2048
embedding:
  provider: mock
  dimension: 1024
  model_name: mock-embedding
safety:
  rule_set_id: kylin-memoryhub.safety
  rule_set_version: '1.0'
  policy:
    policy_id: default
    version: '1.0'
    rule_overrides: []
    level_overrides: []
    exceptions: []
    fallback_action: review
    on_scan_error: review
    on_unmaskable: review
    auto_sanitize: true
    fail_closed: true
  auto_mask: true
  reject_on_detect: false
  audit:
    enabled: true
    directory: data/safety-audit
    hmac_key_env: MEMORYHUB_AUDIT_HMAC_KEY
    key_id: device-local-v1
    rotate_max_bytes: 16777216
    retention_days: 180
    max_record_bytes: 65536
    lock_timeout_seconds: 5.0
    strict_permissions: true
    fsync: true
    fail_closed: true
  quarantine:
    enabled: true
    directory: data/review-quarantine
    encryption_key_env: MEMORYHUB_QUARANTINE_KEY
    key_id: device-local-v1
    retention_days: 30
    max_record_bytes: 4194304
    strict_permissions: true
    fsync: true
    fail_closed: true
  user_rules:
    enabled: false
    encryption_key_env: MEMORYHUB_USER_RULE_KEY
    key_id: device-local-v1
    max_rules_per_user: 100
    max_matcher_chars: 2048
    allow_advanced_regex: false
    detector_cache_size: 256
  max_depth: 32
  max_field_chars: 65536
  max_scan_bytes: 2097152
  max_scanned_fields: 10000
  max_candidates: 2048
  max_findings: 1024
  max_path_chars: 4096
debug: true
log_level: INFO
host: 0.0.0.0
port: 8099
