# 本地开发配置（生产配置样板见 config.example.yaml，配置说明见 docs/configuration.md）
runtime:
  mode: development
  allow_fallback: true

# vNext 链路切流（默认 vNext 主链路；回滚/观测模式见 docs/configuration.md）
vnext:
  # legacy | shadow | dual-read | canary | vnext
  mode: vnext
  canary_percent: 0
  policy_required: true
  authority_single_writer: true
  allow_policy_bypass: false
  allow_legacy_read_fallback: true
  rollback_window_minutes: 60
  observation_window_requests: 1
  # shadow | candidate-only | authority
  formation_mode: authority
  events_default: true

storage:
  db_path: data/memoryhub.db
  vector_index_path: data/vector_index
  evidence_path: data/evidence
  cache_max_size: 1000
retrieval:
  default_top_k: 5
  vector_weight: 0.6
  keyword_weight: 0.3
  metadata_weight: 0.1
  rerank_enabled: true
  cache_ttl_seconds: 300
llm:
  api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  # 仅通过 LLM_API_KEY / MEMORYHUB_LLM_API_KEY 注入，不要把密钥写入仓库。
  api_key: ""
  model: qwen-flash
  temperature: 0.1
  max_tokens: 2048
embedding:
  # 麒麟环境使用真实 Embedding SDK（libkylin-coreai-embedding.so），输出固定 768 维
  provider: kylin
  dimension: 768
  # 麒麟模型名称（真实 SDK 模式必填）
  model_name: ensemble-embd_gte-base_uint8-text
  # 动态库显式路径（kylin 模式，空则按默认路径探测）
  so_path: "/usr/lib/libkylin-coreai-embedding.so"
  # 单次推理超时（毫秒）；超时返回稳定错误码 embedding.timeout
  query_timeout_ms: 250
safety:
  rule_set_id: kylin-memoryhub.safety
  rule_set_version: '1.0'
  policy:
    policy_id: default
    version: '1.0'
    rule_overrides: []
    level_overrides: []
    exceptions: []
    fallback_action: review
    on_scan_error: review
    on_unmaskable: review
    auto_sanitize: true
    fail_closed: true
  auto_mask: true
  reject_on_detect: false
  audit:
    enabled: true
    directory: data/safety-audit
    hmac_key_env: MEMORYHUB_AUDIT_HMAC_KEY
    key_id: device-local-v1
    rotate_max_bytes: 16777216
    retention_days: 180
    max_record_bytes: 65536
    lock_timeout_seconds: 5.0
    strict_permissions: true
    fsync: true
    fail_closed: true
  quarantine:
    enabled: true
    directory: data/review-quarantine
    encryption_key_env: MEMORYHUB_QUARANTINE_KEY
    key_id: device-local-v1
    retention_days: 30
    max_record_bytes: 4194304
    strict_permissions: true
    fsync: true
    fail_closed: true
  user_rules:
    enabled: false
    encryption_key_env: MEMORYHUB_USER_RULE_KEY
    key_id: device-local-v1
    max_rules_per_user: 100
    max_matcher_chars: 2048
    allow_advanced_regex: false
    detector_cache_size: 256
  max_depth: 32
  max_field_chars: 65536
  max_scan_bytes: 2097152
  max_scanned_fields: 10000
  max_candidates: 2048
  max_findings: 1024
  max_path_chars: 4096
# 服务监听地址/端口由 uvicorn 命令行参数控制（见 docs/configuration.md），不在本文件配置
debug: true
