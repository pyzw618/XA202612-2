[project]
name = "kylin-memoryhub"
version = "0.1.0"
description = "面向麒麟 OS Agent 的可插拔本地记忆中枢"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "faiss-cpu>=1.7",
    "rank-bm25>=0.2",
    "jieba>=0.42",
    "httpx>=0.27",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "mypy>=1.10",
    "ruff>=0.3",
]
eval = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"memoryhub.safety_rules.data" = ["*.json"]
"memoryhub.core.fact" = ["predicate_ontology.json"]

[tool.setuptools.packages.find]
include = ["memoryhub*", "evaluation*"]
exclude = ["idea*", "tests*", "docs*"]
