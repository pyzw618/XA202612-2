# Kylin-MemoryHub 生产配置文件示例
# 复制此文件为 config.yaml 并根据实际环境修改
#
# 注意：本文件默认展示生产环境（runtime.mode=production）配置，
# 要求 embedding 使用银河麒麟真实 SDK、向量引擎使用 Milvus 真实 SDK，
# 且向量维度固定为 768。本地开发/测试请改为 development/test 模式。

# ==================== 运行模式配置 ====================
runtime:
  # 运行模式: "production" | "development" | "test"
  # production 模式下禁止 mock/kylin_mock/faiss/milvus_mock 和静默降级
  mode: production

  # 是否允许在 development/test 环境下触发 FAISS 等降级后端
  # production 模式下必须为 false
  allow_fallback: false

# ==================== 存储配置 ====================
storage:
  # SQLite 数据库路径（端侧唯一事实源）
  db_path: "data/memoryhub.db"

  # FAISS 向量索引路径（仅 development/test 使用，生产模式不可达）
  vector_index_path: "data/vector_index"

  # 证据链存储路径 (JSONL格式)
  evidence_path: "data/evidence"

  # 检索缓存最大条目数
  cache_max_size: 1000

# ==================== 检索配置 ====================
retrieval:
  # 默认返回 Top-K 结果数
  default_top_k: 5

  # HybridSearch 召回候选倍数：最终召回 top_k * candidate_multiplier 个候选
  candidate_multiplier: 4

  # 查询文本最大字符数
  max_query_chars: 512

  # 延迟预算（毫秒），供可观测性指标与后续真实环境验收使用
  target_p95_ms: 350
  target_p99_ms: 500

  # 以下权重字段仅 HybridRetriever（FAISS + BM25）使用；
  # 生产模式使用 MilvusHybridRetriever，由引擎执行稠密/稀疏 RRF 融合
  vector_weight: 0.6
  keyword_weight: 0.3
  metadata_weight: 0.1

  # 是否启用 Reranker 重排序；生产模式下建议关闭
  rerank_enabled: false

  # 检索缓存 TTL (秒)
  cache_ttl_seconds: 300

# ==================== LLM 配置 ====================
llm:
  # 提供商: "openai" (兼容 OpenAI API) | "ollama" (本地推理)
  provider: "ollama"

  # API 基础地址
  # OpenAI 兼容: https://api.openai.com/v1 或其他兼容端点
  # Ollama: http://localhost:11434/v1
  api_base: "http://localhost:11434/v1"

  # API 密钥 (OpenAI 兼容模式需要)
  api_key: ""

  # 模型名称
  # OpenAI: "gpt-4o-mini", "gpt-4o"
  # Ollama: "qwen2:1.5b", "qwen2:7b", "llama3:8b"
  model: "qwen2:7b"

  # 生成温度 (0.0 - 2.0)
  temperature: 0.1

  # 最大生成 token 数
  max_tokens: 2048

# ==================== Embedding 配置 ====================
embedding:
  # 生产模式必须使用 "kylin"（银河麒麟真实 SDK）
  # 其他可选: "kylin_mock" | "mock" | "auto"（仅 development/test）
  provider: "kylin"

  # 麒麟模型固定输出 768 维；生产模式必须与 vector_engine.dimension 一致
  dimension: 768

  # 模型名称 (kylin 模式下必填)
  model_name: "ensemble-embd_gte-base_uint8-text"

  # 动态库显式路径 (kylin/kylin_mock 模式，空则按默认路径探测)
  so_path: "/usr/lib/libkylin-coreai-embedding.so"

  # Embedding 推理超时（毫秒）；超过时生产环境返回稳定超时错误
  query_timeout_ms: 250

# ==================== 向量引擎配置 ====================
vector_engine:
  # 生产模式必须使用 "milvus"（麒麟 Milvus SDK）
  # 其他可选: "faiss" | "milvus_mock"（仅 development/test）
  provider: "milvus"

  # 部署平台提供的非空应用标识；不是 collection 或 user ID
  # 生产环境请替换为实际 app_id，不要将敏感值写入仓库
  app_id: "<provided-by-deployment-platform>"

  # Milvus C API 动态库显式路径 (milvus 模式，空则按默认路径探测)
  so_path: "/usr/lib/libkysdk-vector-engine-client-capi.so"

  # Milvus 服务地址与端口
  host: "127.0.0.1"
  port: 19530

  # Milvus 集合名；生产模式 collection schema 维度固定 768
  collection: "memoryhub"
  dimension: 768

  # Milvus 查询超时（毫秒）；超过时生产环境返回稳定超时错误
  search_timeout_ms: 120

# ==================== 安全配置 ====================
safety:
  # 内置声明式规则资产：
  # memoryhub/safety_rules/data/catalog.json
  # version 必须在 catalog 中精确存在；缺失时不会静默回退。
  rule_set_id: "kylin-memoryhub.safety"
  rule_set_version: "1.0"

  # 不设置 sensitive_patterns 时，SafetyConfig 从上述版本化规则集取得不可变
  # 快照并编译为兼容 SensitiveRule。旧 inline 规则仅作为迁移入口，不建议复制
  # 内置规则；新规则应发布为新的规则集版本并补齐结构化溯源。

  # risk_level 只表示风险；最终动作由规则 default_action 和 policy 覆盖共同决定。
  # 声明式 redact_allow 会编译为现有 SafetyAction.MASK，且仍须脱敏后复检。
  policy:
    policy_id: "default"
    version: "1.0"
    rule_overrides: []
    level_overrides: []
    # ALLOW 不能通过普通 override 配置。低风险上下文标识如需例外，必须在
    # exceptions 中提供规则作用域、至少一个场景/用途/路径选择器、原因、
    # 负责人、版本和带时区的 expires_at；有效期按实际决策时刻判断。
    # 凭据和敏感个人信息不可降为 ALLOW。
    exceptions: []
    fallback_action: "review"
    on_scan_error: "review"
    on_unmaskable: "review"
    auto_sanitize: true
    fail_closed: true

  # 旧版兼容开关，只能收紧策略：
  # reject_on_detect=true 强制拒绝；auto_mask=false 将 MASK 提升为 REVIEW
  auto_mask: true
  reject_on_detect: false

  # 端侧密钥存储：默认首次启动自动生成，之后从固定文件复用。
  # path 为空时使用 <storage.db_path 父目录>/security/safety-keys.json；
  # 环境变量仍可覆盖，并默认导入本地文件，便于已有部署平滑迁移。
  key_store:
    path: ""
    auto_generate: true
    persist_external: true
    import_legacy_env: true
    legacy_env_file: "~/.config/memoryhub/safety.env"
    strict_permissions: true

  # 安全处置审计：只写最小化投影，跨轮转文件保持 HMAC 哈希链。
  # 审计与隔离密钥材料必须不同；retention_days 需配合系统定时清理任务。
  audit:
    enabled: true
    directory: "data/safety-audit"
    hmac_key_env: "MEMORYHUB_AUDIT_HMAC_KEY"
    key_id: "device-local-v1"
    rotate_max_bytes: 16777216
    retention_days: 180
    max_record_bytes: 65536
    lock_timeout_seconds: 5.0
    strict_permissions: true
    fsync: true
    fail_closed: true

  # REVIEW 隔离区：原事件仅以 AES-256-GCM 密文保存；普通存储、检索、
  # Embedding 和日志都不能读取隔离区。密钥值不会写入本 YAML。
  quarantine:
    enabled: true
    directory: "data/review-quarantine"
    encryption_key_env: "MEMORYHUB_QUARANTINE_KEY"
    key_id: "device-local-v1"
    retention_days: 30
    max_record_bytes: 4194304
    strict_permissions: true
    fsync: true
    fail_closed: true

  # 前端管理的用户自定义敏感规则。matcher 以 AES-256-GCM 密文保存在
  # storage.db_path 的独立表中，主密钥只从环境变量/设备凭据服务读取。
  # 此密钥不得与 audit 或 quarantine 密钥复用。
  user_rules:
    enabled: true
    encryption_key_env: "MEMORYHUB_USER_RULE_KEY"
    key_id: "device-local-v1"
    max_rules_per_user: 100
    max_matcher_chars: 2048
    allow_advanced_regex: false
    detector_cache_size: 256

  # 递归扫描资源预算；快照前的结构超限抛 SafetyScanError，
  # 快照后的候选/Finding 超限返回 scan_complete=false。
  # process() 对不完整扫描失败关闭为 REVIEW/REJECT。
  max_depth: 32  # 支持范围 1..64
  max_field_chars: 65536
  max_scan_bytes: 2097152
  max_scanned_fields: 10000
  max_candidates: 2048
  max_findings: 1024
  max_path_chars: 4096

# ==================== 应用配置 ====================
# 调试模式 (生产环境请设为 false)
debug: false

# 日志级别: DEBUG | INFO | WARNING | ERROR
log_level: "INFO"

# 服务监听地址
host: "0.0.0.0"

# 服务监听端口
port: 8099
