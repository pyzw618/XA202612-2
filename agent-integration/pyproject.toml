[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kylin-memoryhub-agent-integration"
version = "0.2.0"
description = "CLI and MCP integration surface for Kylin-MemoryHub"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
memoryhub = "memoryhub_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memoryhub_client*", "memoryhub_cli*", "memoryhub_mcp*"]
